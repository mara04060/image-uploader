services:

  # PostgreSQL 18
  postgres:
    image: postgres:18.6-alpine3.24
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_SCHEME: ${POSTGRES_SCHEME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  # Python application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      APP_PORT: ${APP_PORT}
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEME: ${POSTGRES_SCHEME}
      POSTGRES_PORT: ${POSTGRES_PORT}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS}
    volumes:
      - ./images:/app/images
      - ./logs:/app/logs
      - ./static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  backup_scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: backup_scheduler
    user: "${UID:-1000}:${GID:-1000}"
    command: ["python3", "-u", "backup_scheduler.py"]
    environment:
      BACKUP_DIR: ${BACKUP_DIR}
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEME: ${POSTGRES_SCHEME}
      POSTGRES_PORT: ${POSTGRES_PORT}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES}

    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: always

  # NGINX
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - ./images:/app/images:ro
    depends_on:
      - app
    networks:
      - app-network

volumes:
  postgres-data:

  # Internal Docker network
networks:
  app-network:
    driver: bridge