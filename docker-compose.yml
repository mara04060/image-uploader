services:

  # PostgreSQL 18
  db:
    image: postgres:18.6-alpine3.24
    restart: always
    shm_size: 128mb
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  # Python application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    expose:
      - "8000"
    environment:
      APP_PORT: 8000
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEME: ${DB_SCHEME}
      DB_PORT: ${DB_PORT}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Python: read/write
      - ./images:/app/images
      - ./logs:/app/logs
    networks:
      - app-network


  backup_scheduler:
      build:
        context: .
        dockerfile: Dockerfile
        target: app
      container_name: backup_scheduler
      command: ["python3", "-u", "backup_scheduler.py"]
      environment:
        BACKUP_DIR: ${BACKUP_DIR}
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES}
      volumes:
        - .${BACKUP_DIR}:${BACKUP_DIR}
      networks:
        - app-network
      depends_on:
        - db
      restart: always

  # NGINX
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - ./images:/app/images:ro
      - ./logs:/logs
    depends_on:
      - app
    networks:
      - app-network

volumes:
  postgres-data:

  # Internal Docker network
networks:
  app-network:
    driver: bridge