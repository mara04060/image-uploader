services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./images:/app/images
      - ./static:/app/static
      - ./logs:/app/logs
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - ./images:/app/images:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge