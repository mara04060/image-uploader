services:

  app:
    build: .
    ports:
      - "8000:8000"

    volumes:
      - ./images:/app/images
      - ./logs:/app/logs

    networks:
      - app-network

  nginx:
    image: nginx:1.31-alpine
    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app

    networks:
      - app-network


networks:
  app-network:
    driver: bridge
