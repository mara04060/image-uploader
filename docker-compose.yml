services:

# PostGreSQL 18
  db:
    image: postgres:18.6-alpine3.24
    restart: always
    shm_size: 128Mb
    environment:
      POSTGRES_DB: images_db
      POSTGRES_USER: root_user
      POSTGRES_PASSWORD: passw123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U root_user -d images_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - app
    networks:
      - app-network

  # Python application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    expose:
      - "8000"
    volumes:
      # Python: read/write
      - ./images:/app/images
      - ./logs:/app/logs
    networks:
      - app-network


  # NGINX
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "8080:80"
    volumes:
      - ./images:/app/images:ro
      - ./logs:/logs
    depends_on:
      - app
    networks:
      - app-network

volumes:
  postgres-data:

  # Internal Docker network
networks:
  app-network:
    driver: bridge